version: '3.5'

services:
  minio:
    image: minio/minio
    container_name: fb-minio
    networks:
      - fb-dev
    command: server --console-address ":9001" /data/
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - 'minio_data:/data'
  mongo:
    container_name: fb-mongo
    image: mongo
    networks:
      - fb-dev
    ports:
      - "27017:27017"
  mongo-express:
    container_name: fb-mongo-ui
    image: mongo-express
    networks:
      - fb-dev
    environment:
      - ME_CONFIG_MONGODB_SERVER=fb-mongo
    ports:
      - "8081:8081"
    depends_on:
      - mongo
  redis:
    image: redis
    container_name: fb-redis
    networks:
      - fb-dev
    ports:
      - "6379:6379"
  nats:
    image: nats
    container_name: fb-nats
    networks:
      - fb-dev
    ports:
      - "8222:8222"
      - "4222:4222"
  nats-1:
    container_name: fb-nats-1
    image: nats
    networks:
      - fb-dev
    command: "--cluster nats://0.0.0.0:6222 --routes=nats://ruser:T0pS3cr3t@nats:6222"
    depends_on:
      - nats
  nats-2:
    container_name: fb-nats-2
    image: nats
    networks:
      - fb-dev
    command: "--cluster nats://0.0.0.0:6222 --routes=nats://ruser:T0pS3cr3t@nats:6222"
    depends_on:
      - nats
  kibana:
    container_name: fb-kibana
    image: kibana:7.14.2
    networks:
      - fb-dev
    environment:
      - xpack.security.enabled=false
      - monitoring.ui.container.elasticsearch.enabled=true
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch
  elasticsearch:
    image: elasticsearch:7.14.2
    container_name: fb-elastic
    networks:
      - fb-dev
    environment:
      - xpack.security.enabled=false
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - "9200:9200"
  logstash:
    image: logstash:7.14.2
    container_name: fb-logstash
    networks:
      - fb-dev
    environment:
      - xpack.monitoring.enabled=true
      - "LS_JAVA_OPTS=-Xms256m -Xmx256m"
    volumes:
      - type: bind
        source: ./logstash.conf
        target: /usr/share/logstash/pipeline/logstash.conf
        read_only: true
    ports:
      - "5044:5044"
      - "6000:6000/tcp"
      - "6000:6000/udp"
      - "9600:9600"
    depends_on:
      - elasticsearch

volumes:
  minio_data:
    driver: local
    
networks:
  fb-dev:
    name: fb-dev